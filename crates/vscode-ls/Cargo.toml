[package]
name = "vscode-ls"
description = "Serwer językowy dla Rust, TypeScript i JavaScript — most między Visual Studio Code a projektem aurola."
keywords = ["lsp", "vscode", "language-server", "rust", "typescript"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = { workspace = true }
serde_json = { workspace = true }
vscode-bridge = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "vscode-ls"
path = "src/main.rs"