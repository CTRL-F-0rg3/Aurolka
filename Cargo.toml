[workspace]
resolver = "2"
members = ["lib/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ctrl/aurola"

[workspace.dependencies]
aurum = { path = "lib/aurum", version = "0.1.0" }
glaz = { path = "lib/glaz", version = "0.1.0" }
neuro-lib = { path = "crates/neuro-lib", version = "0.1.0" }
vscode-bridge = { path = "lib/vscode-bridge", version = "0.1.0" }

bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.16"
log = "0.4"
lucide-icons = "1.49"
rodio = "0.22"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

[profile.dev]
# Renderowanie w GPU bywa wrażliwe na timing — debug opt-level 1 bywa szybszy.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

